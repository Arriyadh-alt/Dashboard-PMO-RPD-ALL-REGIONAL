<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#112b3c">
<title>Dashboard RPD · PMO</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="command-center.css">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-water" viewBox="0 0 24 24"><path d="M12 3C9 7 5.5 10.7 5.5 15a6.5 6.5 0 0 0 13 0C18.5 10.7 15 7 12 3Z"/><path d="M9 15a3 3 0 0 0 3 3"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m3 10v-3a6 6 0 0 0-2-4"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8m-8 4h6"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 6h18M6 12h12m-9 6h6"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/><circle cx="12" cy="12" r="9"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v18h17M8 16v-5m5 5V7m5 9V4"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
</defs></svg>
<div id="app" hidden>
<aside class="sidebar" aria-label="Navigasi dashboard">
<div class="brand"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-water"/></svg></span><div class="brand-copy"><div class="brand-name">PMO RPD</div><span class="brand-sub">Seluruh Regional</span></div></div>
<div class="nav-label">Menu utama</div>
<div class="tabs" role="tablist" aria-label="Laporan dashboard" aria-orientation="vertical">
<button id="tab-ringkasan" data-tab="ringkasan" role="tab" aria-controls="main" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span class="nav-text">Ringkasan</span></button>
<button id="tab-kelurahan" data-tab="kelurahan" role="tab" aria-controls="main" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="nav-text">Data Wilayah</span></button>
<button id="tab-korlap" data-tab="korlap" role="tab" aria-controls="main" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span class="nav-text">Kinerja Tim</span></button>
<button id="tab-outstanding" data-tab="outstanding" role="tab" aria-controls="main" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><span class="nav-text">Outstanding</span></button>
<button id="tab-data" data-tab="data" role="tab" aria-controls="main" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="nav-text">Cari PAM ID</span></button>
</div>
<div class="sidebar-bottom"><button id="tab-catatan" class="admin-nav" data-tab="catatan" aria-controls="main" hidden><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span class="nav-text">Admin</span></button><button id="collapse-nav" aria-label="Tutup menu" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg><span class="nav-text">Tutup menu</span></button></div>
</aside>
<div class="workspace">
<header class="topbar"><div class="breadcrumb"><strong>PMO RPD</strong><span>Monitoring Regional</span></div><div class="top-actions"><button id="thm" class="theme-button" aria-label="Aktifkan tema gelap" title="Ganti tema"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button><span id="role">Guest</span><button id="out" hidden>Keluar</button></div></header>
<div class="w page-heading"><div><h1 id="page-title">Ringkasan</h1><p class="mu" id="sub"></p></div><span id="period-label" class="report-badge">Semua Data</span></div>
<section class="bar" aria-label="Filter laporan"><div class="w"><button id="ft" aria-expanded="false" aria-controls="gf"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span id="filter-text">Filter laporan</span></button><div class="fl" id="gf">
<label class="filter-field">Periode<select id="fperiod"><option value="all">Semua Data</option><option value="today">Hari Ini</option><option value="week">7 Hari</option><option value="month">Bulan Ini</option><option value="custom">Pilih Periode</option></select></label>
<label class="filter-field">Regional<select id="fr"></select></label><label class="filter-field">Area Bisnis<select id="fa"></select></label><label class="filter-field">Kelurahan<select id="fk"></select></label><button id="rs">Reset</button>
</div></div></section>
<section class="w command-toolbar" aria-label="Cakupan dan ekspor"><div id="active-filters"></div><details class="export-menu" hidden><summary>Unduh laporan</summary><div class="export-controls"><label for="report-kind">Laporan</label><select id="report-kind"><option value="executive">Ringkasan</option><option value="regional">Data Regional</option><option value="area">Data Wilayah</option><option value="team">Kinerja Tim</option><option value="outstanding">Outstanding</option></select><button data-export="csv">CSV</button><button data-export="xlsx">Excel</button><button data-export="pdf">PDF</button></div></details></section>
<p class="w service-status" id="service-status" role="status" aria-live="polite"></p>
<main class="w" id="main" role="tabpanel" aria-labelledby="tab-ringkasan" tabindex="0"></main>
<footer class="wm"><span>PMO RPD · PAM JAYA</span><span>Design by Arriyadh</span></footer>
</div>
</div>
<div id="lg">
<section class="login-form-side" aria-labelledby="login-title"><form class="lgc" id="login-form"><h1 id="login-title">PMO RPD</h1><p class="login-intro">Monitoring Kinerja Seluruh Regional</p>
<label for="li">ID pengguna</label><input id="li" placeholder="Masukkan ID pengguna" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label for="lp">Kata sandi</label><input id="lp" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<button id="lb" class="login-submit" type="submit">Masuk</button><p id="le" class="login-status" role="status" aria-live="polite"></p>
</form></section>
</div>
<script src="app.js" defer></script>
<script src="potential.js" defer></script>
<script src="command-center.js" defer></script>
</body>
</html>
